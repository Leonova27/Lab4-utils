# Название рабочего процесса
name: Python package CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]   # деплой сработает только при создании тега версии

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest

      - name: Run tests
        run: |
          pytest -q

      - name: Build package
        run: |
          python -m build

      - name: Check dist folder
        run: |
          ls -l dist/

  publish-to-testpypi:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Публикация сработает ТОЛЬКО если вы создали тег версии (например, v0.1.0)
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pypa/gh-action-pypi-publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Адрес тестового репозитория
          repository-url: https://test.pypi.org/legacy/
          # Рекомендуемый способ: логин __token__, а секрет — API-токен TestPyPI
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          # Файлы лежат в папке dist
          packages-dir: dist/