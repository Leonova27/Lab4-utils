name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest


    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Upgrade pip and install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install project in editable mode (optional)
      if: ${{ !contains(github.event.head_commit.message, 'skip-install') }}
      run: pip install -e .

    - name: Run tests
      run: pytest -v

    - name: Build package
      run: |
        pip install build
        python -m build
    - name: Verify dist files
      run: ls -la dist/
